name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          sudo mv gradle-8.7 /opt/gradle
          sudo rm -f /usr/bin/gradle
          sudo ln -s /opt/gradle/bin/gradle /usr/bin/gradle

      - name: Find Project and Build Debug APK
        run: |
          PROJ_DIR=$(find . -name "settings.gradle*" -exec dirname {} \;)
          if [ -z "$PROJ_DIR" ]; then
            echo "Error: No se encontró ningún archivo de configuración de Gradle"
            exit 1
          fi
          echo "Proyecto encontrado en la carpeta: $PROJ_DIR"
          cd "$PROJ_DIR"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
